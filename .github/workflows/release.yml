name: Build Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    uses: ./.github/workflows/ci.yml
  build:
    needs: validate
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        sdk: ['24.10.8', '25.12.5']
    steps:
      - uses: actions/checkout@v4
      - name: Validate release version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version="$(sed -n 's/^PKG_VERSION:=//p' luci-app-mt5700m/Makefile)"
          test "${GITHUB_REF_NAME}" = "v${version}"
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib gettext git libncurses-dev libssl-dev python3-setuptools rsync swig unzip zlib1g-dev file curl zstd
      - name: Build with the official OpenWrt SDK
        env:
          SDK_VERSION: ${{ matrix.sdk }}
        run: ./scripts/build-release.sh
      - name: Archive this SDK build
        run: |
          mkdir -p release-assets
          tar -czf release-assets/mt5700m-${{ github.ref_name }}-openwrt-${{ matrix.sdk }}-mediatek-filogic.tar.gz -C dist-release .
          (cd release-assets && sha256sum *.tar.gz > mt5700m-openwrt-${{ matrix.sdk }}.sha256)
      - uses: actions/upload-artifact@v4
        with:
          name: mt5700m-${{ matrix.sdk }}
          path: release-assets/*
          if-no-files-found: error
  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: mt5700m-*
          merge-multiple: true
          path: release-assets
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" release-assets/*
          else
            gh release create "${GITHUB_REF_NAME}" release-assets/* --title "MT5700M Manager ${GITHUB_REF_NAME}" --generate-notes
          fi
